<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background sky -->
  <rect width="128" height="128" rx="16" fill="#0E0F17"/>
  <!-- Ground platform -->
  <rect x="16" y="88" width="96" height="12" rx="3" fill="#4A9E6B"/>
  <rect x="16" y="88" width="96" height="4" rx="2" fill="#6FCF97"/>
  <!-- Small platform floating -->
  <rect x="56" y="56" width="40" height="8" rx="2" fill="#4A9E6B"/>
  <rect x="56" y="56" width="40" height="3" rx="1" fill="#6FCF97"/>
  <!-- Player character (pixel art style) -->
  <!-- Body -->
  <rect x="28" y="72" width="12" height="16" fill="#E8C97E"/>
  <!-- Head -->
  <rect x="29" y="62" width="10" height="10" fill="#F5DEB3"/>
  <!-- Eye -->
  <rect x="35" y="65" width="2" height="2" fill="#1A1A2E"/>
  <!-- Stars -->
  <rect x="24" y="20" width="3" height="3" fill="#FFD700"/>
  <rect x="60" y="14" width="3" height="3" fill="#FFD700"/>
  <rect x="96" y="24" width="3" height="3" fill="#FFD700"/>
  <rect x="44" y="36" width="2" height="2" fill="#A8D8EA"/>
  <rect x="80" y="40" width="2" height="2" fill="#A8D8EA"/>
  <!-- Moon -->
  <circle cx="96" cy="28" r="12" fill="#2A2D4A"/>
  <circle cx="100" cy="24" r="9" fill="#0E0F17"/>
</svg>
